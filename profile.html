<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Global Peace, Youth Entrepreneurship, and Wellbeing</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header role="banner">
        <nav role="navigation" aria-label="Main Navigation">
            <div class="logo">
                <a href="index.html">GPW</a>
            </div>
            <ul>
                <li><a href="index.html#peace" aria-label="Navigate to Peace and Stability section">Peace & Stability</a></li>
                <li><a href="index.html#youth" aria-label="Navigate to Youth Entrepreneurship section">Youth Entrepreneurship</a></li>
                <li><a href="index.html#wellbeing" aria-label="Navigate to Wellbeing section">Wellbeing</a></li>
                <li><a href="arts.html">Arts</a></li>
                <li><a href="talents.html">Talents</a></li>
                <li><a href="entertainment.html">Entertainment</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="funding.html">Funding</a></li>
                <li><a href="settings.html" aria-label="Navigate to Settings page">Settings</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <section id="profile" class="feature">
            <h2>User Profile</h2>
            <div class="profile-container">
                <div class="profile-picture">
                    <img src="https://via.placeholder.com/150" alt="Profile Picture" id="profile-pic">
                    <video id="camera-stream" autoplay style="display: none;"></video>
                    <button id="use-camera">Use Camera</button>
                    <button id="capture" style="display: none;">Capture</button>
                    <canvas id="canvas" style="display: none;"></canvas>
                </div>
                <form id="profile-form">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <label for="bio">Short Bio:</label>
                    <textarea id="bio" name="bio"></textarea>
                    <button type="submit">Create Account</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Global Peace, Youth Entrepreneurship, and Wellbeing. All rights reserved.</p>
    </footer>

    <script src="profile.js"></script>
</body>
</html>
