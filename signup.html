<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - GPW</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">GPW</a>
            </div>
            <ul>
                <li><a href="index.html#peace">Peace & Stability</a></li>
                <li><a href="entrepreneurship.html">Youth Entrepreneurship</a></li>
                <li><a href="wellbeing.html">Wellbeing</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="feature">
            <h2>Create Your Account</h2>
            <form id="signup-form">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="cta-button">Sign Up</button>
            </form>
            <p id="message"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Global Peace, Youth Entrepreneurship, and Wellbeing. All rights reserved.</p>
    </footer>

    <script src="signup.js"></script>
</body>
</html>
