<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Global Peace, Youth Entrepreneurship, and Wellbeing</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="settings.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header role="banner">
        <nav role="navigation" aria-label="Main Navigation">
            <div class="logo">
                <a href="index.html">GPW</a>
            </div>
            <ul>
                <li><a href="index.html#peace" aria-label="Navigate to Peace and Stability section">Peace & Stability</a></li>
                <li><a href="index.html#youth" aria-label="Navigate to Youth Entrepreneurship section">Youth Entrepreneurship</a></li>
                <li><a href="index.html#wellbeing" aria-label="Navigate to Wellbeing section">Wellbeing</a></li>
                <li><a href="settings.html" aria-label="Navigate to Settings page">Settings</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <section id="settings" class="feature">
            <h2>Settings</h2>
            <p>Manage your preferences and settings for the platform.</p>
        </section>

        <div id="chatbot-container">
            <div id="chatbot-header">
                <h2>AI Educator</h2>
            </div>
            <div id="chatbot-messages"></div>
            <div id="chatbot-input-container">
                <input type="text" id="chatbot-input" placeholder="Ask me anything...">
                <button id="chatbot-send">Send</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Global Peace, Youth Entrepreneurship, and Wellbeing. All rights reserved.</p>
    </footer>

    <script src="settings.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then((registration) => {
                    console.log('Service Worker registered with scope:', registration.scope);
                })
                .catch((error) => {
                    console.error('Service Worker registration failed:', error);
                });
        }
    </script>
</body>
</html>
