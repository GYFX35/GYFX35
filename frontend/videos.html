<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos - GPW</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="videos.css">
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body>

    <main id="main-content">
        <section class="hero">
            <div class="hero-content">
                <h1>Explore Videos</h1>
                <p>Watch videos from our community.</p>
            </div>
        </section>

        <section id="gallery" class="feature">
            <h2>Video Gallery</h2>
            <div class="gallery-container">
                </div>
        </section>

        <section id="submission" class="feature">
            <h2>Submit a Video</h2>
            <form id="video-submission-form">
                <input type="text" id="video-title" placeholder="Video Title" required>
                <input type="url" id="video-url" placeholder="Video URL" required>
                <textarea id="video-description" placeholder="Video Description"></textarea>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <script src="header.js"></script>
    <script src="script.js"></script>
    <script src="videos.js"></script>
    <script src="footer.js"></script>
</body>
</html>
