<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Global Peace, Youth Entrepreneurship, and Wellbeing</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="profile.css">
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body>

    <main id="main-content">
        <section id="profile" class="feature">
            <h2>User Profile</h2>
            <div class="profile-container">
                <div class="profile-picture">
                    <img src="https://via.placeholder.com/150" alt="Profile Picture" id="profile-pic">
                    <video id="camera-stream" autoplay style="display: none;"></video>
                    <button id="use-camera">Use Camera</button>
                    <button id="capture" style="display: none;">Capture</button>
                    <canvas id="canvas" style="display: none;"></canvas>
                </div>
                <form id="profile-form">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <label for="bio">Short Bio:</label>
                    <textarea id="bio" name="bio"></textarea>
                    <button type="submit">Create Account</button>
                </form>
            </div>
        </section>
    </main>

    <script src="header.js"></script>
    <script src="script.js"></script>
    <script src="profile.js"></script>
    <script src="../shared/footer.js"></script>
</body>
</html>
