<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Investment and Finances Forum</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="global-investment-finances-forum.css">
    <link rel="manifest" href="manifest.json">
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body>

    <main id="main-content">
        <section class="hero">
            <div class="hero-content">
                <h1>Global Investment and Finances Forum</h1>
                <p>Discuss, share, and learn about global investment and finance.</p>
            </div>
        </section>

        <section class="forum-section">
            <h2>Forum Discussions</h2>
            <ul class="forum-list" id="general-discussion-list">
            </ul>
            <div id="status-message"></div>
            <form id="new-post-form">
                <h3>Create a New Post</h3>
                <input type="text" id="post-title" placeholder="Post Title" required>
                <textarea id="post-content" placeholder="Post Content" required></textarea>
                <button type="submit">Create Post</button>
            </form>
        </section>

        <section id="gallery" class="feature">
            <h2>Video Gallery</h2>
            <div class="gallery-container">
                </div>
        </section>

        <section id="submission" class="feature">
            <h2>Submit a Video</h2>
            <div id="video-status-message"></div>
            <form id="video-submission-form">
                <input type="text" id="video-title" placeholder="Video Title" required>
                <input type="url" id="video-url" placeholder="Video URL" required>
                <textarea id="video-description" placeholder="Video Description"></textarea>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <script src="header.js"></script>
    <script src="global-investment-finances-forum.js"></script>
    <script src="../shared/footer.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
</body>
</html>
