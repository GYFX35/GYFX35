<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Business Advisor & Strategist</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="ai-assistant.css">
</head>
<body>
    <header></header>

    <main>
        <section id="ai-assistant-container">
            <h1>AI Business Advisor & Strategist</h1>
            <p>Your strategic guide for Global Peace, Youth Entrepreneurship, and Wellbeing.</p>
            <div id="chat-window">
                <div id="message-display"></div>
                <div id="loading-indicator" style="display: none;">Thinking...</div>
            </div>
            <form id="chat-form">
                <input type="text" id="message-input" placeholder="Ask your question..." autocomplete="off">
                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <script src="header.js"></script>
    <script src="ai-assistant.js"></script>
    <script src="../shared/footer.js"></script>
</body>
</html>
