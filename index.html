<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Business Compliance Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chatbot.css">
</head>
<body>
    <div class="container">
        <h1>Global Business Compliance Assistant</h1>
        <p>Select a country to view its business regulations and compliance requirements.</p>
        <div id="app">
            <div class="form-group">
                <label for="country-select">Select a Country:</label>
                <select id="country-select">
                    <option value="">--Please choose a country--</option>
                    <option value="US">United States</option>
                    <option value="CA">Canada</option>
                    <option value="GB">United Kingdom</option>
                    <option value="DE">Germany</option>
                    <option value="FR">France</option>
                    <option value="JP">Japan</option>
                </select>
            </div>
            <div id="compliance-info">
                <!-- Compliance info will be displayed here -->
            </div>
        </div>
    </div>

    <div class="chatbot-container">
        <div class="chatbot-header">
            <h2>Customer Support Chat</h2>
            <select id="language-select">
                <option value="en">English</option>
                <option value="es">Español</option>
            </select>
        </div>
        <div class="chatbot-messages" id="chatbot-messages">
            <!-- Chat messages will be appended here -->
        </div>
        <div class="chatbot-input-container">
            <input type="text" id="chatbot-input" placeholder="Ask a question...">
            <button id="chatbot-send">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="chatbot.js"></script>
</body>
</html>
