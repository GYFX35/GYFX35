<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forums - Global Peace, Youth Entrepreneurship, and Wellbeing</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="forums.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">GPW</a>
            </div>
            <ul>
                <li><a href="index.html#peace">Peace & Stability</a></li>
                <li><a href="index.html#youth">Youth Entrepreneurship</a></li>
                <li><a href="index.html#wellbeing">Wellbeing</a></li>
                <li><a href="forums.html">Forums</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="forums-container">
            <h2>Welcome to the Forums</h2>
            <div class="forum-threads">
                <!-- Threads will be dynamically loaded here -->
            </div>
            <div class="new-thread-form">
                <h3>Create a New Thread</h3>
                <form id="new-thread-form">
                    <input type="text" id="thread-title" placeholder="Thread Title" required>
                    <textarea id="thread-content" placeholder="Thread Content" required></textarea>
                    <button type="submit">Post Thread</button>
                </form>
            </div>
        </section>
    </main>

    <footer>

    <script src="forums.js"></script>
